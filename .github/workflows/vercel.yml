name: Deploy to Vercel

on:
  push:
    branches: [main, claude/upbeat-bell-yafe3q]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes --prod
